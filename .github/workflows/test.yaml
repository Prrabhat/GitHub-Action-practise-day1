# Goal: I have to lint, build, test the code for the frontend and backend
# then have to push the image to Docker hub

name: CI
on:
  push:
    branches:[advanced]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout code


      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run test
        run: run npm test
