#Workflow should have the name
name: CICD1
on: 
  workflow_dispatch: 

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: clone the code
        run: echo "cloning the code"
  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
        - name: Building using docker
          run: echo "Buiding using docker"
    
  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
        - name: Running test casses
          run: echo "Testing the app"
  deploy:
    needs: [build,test]
    runs-on: ubuntu-latest
    steps:
        - name: Deploying on the machine
          run: echo "Deploying the code"
